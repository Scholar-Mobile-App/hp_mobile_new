name: g2g_mobile
description: A Flutter app for corporate login system
#android
#version: 1.0.14+18
#ios
version: 1.0.6+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  http: ^1.1.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  another_flushbar: ^1.12.30
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.0.7
  confetti: ^0.7.0
  url_launcher: ^6.3.0
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.3
  open_filex: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/crop.png
    - assets/login_bg.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
